# LLM 结构化提取服务配置文件
# 此文件包含所有可配置的参数，避免硬编码

# LLM 配置
llm:
  # 默认使用的 LLM 提供商
  provider: dashscope
  
  # 各提供商的模型配置
  models:
    dashscope:
      # 模型名称
      name: "qwen3.5-plus"
      # 生成参数
      temperature: 0.1
      max_tokens: 4096
      timeout: 60
    
# 提示词配置
prompts:
  # 系统提示词
  system_instruction: |
    你是一名专业的尽调信息提取分析师。
    你的唯一任务是从原文中定位并复制相关片段，填入指定的 Markdown 骨架。
    任何情况下都不得改写、总结、推断或补充原文没有的内容。
    只输出 Markdown 正文，不加任何解释、注释或代码块标记。
  
  # Few-shot 示例文件路径（相对于项目根目录）
  few_shot_example_path: "llm_structured_extract/templates/examples/company_extract_example.txt"

# 服务配置
service:
  # 默认使用的 schema
  default_schema: ""
  
  # Celery 任务队列名称
  task_queue: "extract"
  
  # 默认超时时间（秒）
  default_timeout: 30